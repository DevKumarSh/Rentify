spring.application.name=RentifyBackend
server.port=8080

# ====================================================================
# OPTION 1: EMBEDDED H2 DATABASE (Active by default - NO INSTALLATION NEEDED!)
# Runs automatically inside the backend, saves data to a local file,
# and provides a built-in browser UI at http://localhost:8080/h2-console
# ====================================================================
spring.datasource.url=jdbc:h2:file:./data/rentifydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console (Browser UI to view tables like phpMyAdmin)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ====================================================================
# OPTION 2: MYSQL DATABASE (Uncomment whenever you install MySQL or XAMPP)
# ====================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/rentify_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Optional SQL initialization scripts
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# JWT Secret Configuration (256-bit key for HS256)
jwt.secret=9a3b6c7d8e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b
jwt.expiration=86400000
